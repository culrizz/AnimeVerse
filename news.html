<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse | News</title>

    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/news.css">
</head>
<body>

    <!-- ===== HEADER ===== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <a href="index.html">AnimeVerse</a>
            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="news.html" class="active">News</a></li>
                <li><a href="wallpapers.html">Wallpapers</a></li>
                <li><a href="profile.html">Profile</a></li>

            </ul>

            <button id="theme-toggle">🌙</button>

        </nav>

    </header>

    <!-- ===== HERO ===== -->

    <section class="hero">

        <h1>Anime News</h1>

        <p>
            Stay updated with the latest anime announcements, trailers, and releases.
        </p>

    </section>

    <!-- ===== SEARCH ===== -->

    <section class="search-section">

        <div class="container">

            <input
                type="text"
                id="news-search"
                placeholder="Search anime news..."
            >

            <button id="search-news-btn">
                Search
            </button>

        </div>

    </section>

    <!-- ===== CATEGORIES ===== -->

    <section class="categories">

        <div class="container">

            <button class="category-btn">All</button>
            <button class="category-btn">Announcements</button>
            <button class="category-btn">Trailers</button>
            <button class="category-btn">Releases</button>
            <button class="category-btn">Events</button>

        </div>

    </section>

    <!-- ===== FEATURED ARTICLE ===== -->

    <section class="featured-news">

        <div class="container">

            <div id="featured-news-card">

                <!-- Featured article will appear here -->

            </div>

        </div>

    </section>

    <!-- ===== NEWS GRID ===== -->

    <main>

        <section class="news-grid-section">

            <div class="container">

                <div id="news-grid" class="news-grid">

                    <!-- News cards added with JavaScript -->

                </div>

            </div>

        </section>

    </main>

    <!-- ===== PAGINATION ===== -->

    <section class="pagination">

        <button id="previous-news-page">
            Previous
        </button>

        <span id="news-page-number">
            1
        </span>

        <button id="next-news-page">
            Next
        </button>

    </section>

    <!-- ===== FOOTER ===== -->

    <footer>

        <div class="container">

            <h2>AnimeVerse</h2>

            <p>
                Your daily source for anime news and updates.
            </p>

            <p>
                © 2026 AnimeVerse. All Rights Reserved.
            </p>

        </div>

    </footer>

    <script src="js/app.js"></script>

</body>
</html>
