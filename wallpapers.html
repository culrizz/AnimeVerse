<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse | Wallpapers</title>

    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
</head>
<body>

    <!-- HEADER -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <a href="index.html">AnimeVerse</a>
            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="wallpapers.html" class="active">Wallpapers</a></li>
                <li><a href="profile.html">Profile</a></li>

            </ul>

            <button id="theme-toggle">🌙</button>

        </nav>

    </header>

    <!-- HERO -->

    <section class="hero">

        <h1>Anime Wallpapers</h1>

        <p>
            Download high-quality wallpapers from your favorite anime.
        </p>

    </section>

    <!-- SEARCH -->

    <section class="search-section">

        <div class="container">

            <input
                type="text"
                id="wallpaper-search"
                placeholder="Search wallpapers..."
            >

            <button id="search-wallpaper-btn">
                Search
            </button>

        </div>

    </section>

    <!-- CATEGORIES -->

    <section class="categories">

        <div class="container">

            <button class="category-btn">All</button>
            <button class="category-btn">One Piece</button>
            <button class="category-btn">Naruto</button>
            <button class="category-btn">Bleach</button>
            <button class="category-btn">Demon Slayer</button>
            <button class="category-btn">Solo Leveling</button>

        </div>

    </section>

    <!-- WALLPAPER GRID -->

    <main>

        <section class="wallpaper-gallery">

            <div class="container">

                <div id="wallpaper-grid" class="wallpaper-grid">

                    <!-- Wallpapers will be inserted by JavaScript -->

                </div>

            </div>

        </section>

    </main>

    <!-- PAGINATION -->

    <section class="pagination">

        <button id="previous-wallpaper-page">
            Previous
        </button>

        <span id="wallpaper-page-number">
            1
        </span>

        <button id="next-wallpaper-page">
            Next
        </button>

    </section>

    <!-- FOOTER -->

    <footer>

        <div class="container">

            <h2>AnimeVerse</h2>

            <p>
                Explore and download stunning anime wallpapers.
            </p>

            <p>
                © 2026 AnimeVerse. All Rights Reserved.
            </p>

        </div>

    </footer>

    <script src="js/app.js"></script>

</body>
</html>
